<!DOCTYPE html>
<html>
    <head>
        <META HTTP-EQUIV="CONTENT-TYPE" CONTENT="text/html; charset=utf-8">
        <meta name="color-scheme" content="light">
        <TITLE data-i18n-doctitle="cal.pageTitle">Camera Calibration</TITLE>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet" type="text/css" href="./css/style.css">
        <script src="./webgazer.js"></script>
        <script src="./js/i18n.js"></script>
    </head>
    <body LANG="en-US" LINK="#0000ff" DIR="LTR">
      <canvas id="plotting_canvas" width="500" height="500" style="cursor:crosshair;"></canvas>

        <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

        <script src="./js/main.js"></script>
        <script src="./js/calibration.js"></script>
        <script src="./js/precision_calculation.js"></script>
        <script src="./js/precision_store_points.js"></script>

        <nav id="webgazerNavbar" class="app-navbar">
          <ul class="app-navbar-group">
            <li id="Accuracy"><a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg> <span data-i18n="cal.notCalibrated">Not yet Calibrated</span></a></li>
            <li><a onclick="Restart()" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg> <span data-i18n="cal.recalibrate">Recalibrate</span></a></li>
          </ul>
          <ul class="app-navbar-group">
            <li><a onclick="skipCalibration()" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.66 6H14a2 2 0 0 1 2 2v2.5l5.248-3.062A.5.5 0 0 1 22 7.87v8.196"/><path d="M16 16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h1"/><line x1="2" x2="22" y1="2" y2="22"/></svg> <span data-i18n="cal.skipNoCam">Zrezygnuj i graj bez kamery</span></a></li>
            <li><a class="helpBtn" onclick="helpModalShow()" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg> <span data-i18n="cal.help">Help</span></a></li>
          </ul>
        </nav>
        <div id="gazeDot"></div>
        <div class="calibrationDiv">
            <input type="button" class="Calibration" id="Pt1"></input>
            <input type="button" class="Calibration" id="Pt2"></input>
            <input type="button" class="Calibration" id="Pt3"></input>
            <input type="button" class="Calibration" id="Pt4"></input>
            <input type="button" class="Calibration" id="Pt5"></input>
            <input type="button" class="Calibration" id="Pt6"></input>
            <input type="button" class="Calibration" id="Pt7"></input>
            <input type="button" class="Calibration" id="Pt8"></input>
            <input type="button" class="Calibration" id="Pt9"></input>
        </div>

        <div id="helpModal" class="modal" role="dialog">
          <div class="modal-dialog">

            <div class="modal-content">
              <div class="modal-body">
                  <div style="display: flex; align-items: center; justify-content: flex-start; gap: 15px;">

                      <span style="color:#0066FF;"><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></span>

                      <span style="font-size: 24px; font-weight: 700; color: #1A1A1A;" data-i18n="cal.modalTitle">
                          Game Camera Calibration!
                      </span>

                  </div>
              </div>
              <div class="modal-footer" style="justify-content: center;">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" onclick="skipCalibration()" data-i18n="cal.playNoCam">Graj bez kamery</button>
                <button type="button" id='start_calibration' class="btn btn-primary" data-bs-dismiss="modal" onclick="Restart()" data-i18n="cal.calibrateBtn">Calibrate</button>
              </div>
            </div>

          </div>
        </div>

        <script src="./js/resize_canvas.js"></script>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    </body>
</html>
