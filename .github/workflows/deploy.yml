name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::DEPLOY_HOOK_URL secret is not set (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          curl -fsSL "$DEPLOY_HOOK_URL"
