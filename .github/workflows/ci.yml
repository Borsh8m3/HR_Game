name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Start server
        run: |
          node server.js &
          echo $! > server.pid

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:3000/ -o /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Server did not come up in time"
          exit 1

      - name: Check /sheet-data
        run: curl -fsS http://localhost:3000/sheet-data -o /dev/null

      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
